<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | CarDock</title><link rel="stylesheet" href="/css/styles.css">
    <script defer src="/js/app.js"></script>
</head>
<body>
<header class="site-header"><a class="brand" href="/">CarDock<span>.</span></a><nav><a href="/">Browse cars</a><a href="/login.html">Log in</a></nav></header>
<main class="page-shell narrow">
    <section class="form-card auth-card"><p class="eyebrow">Join CarDock</p><h1>Create an account</h1>
        <form id="register-form">
            <label>Full name<input id="full-name" name="fullName" maxlength="100" autocomplete="name" required></label>
            <label>Email<input id="email" name="email" type="email" maxlength="150" autocomplete="email" required></label>
            <label>Password<input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><small>Use at least 8 characters.</small></label>
            <button class="button" type="submit">Create account</button>
        </form><p id="form-message" class="message" aria-live="polite"></p>
        <p class="muted">Already registered? <a href="/login.html">Log in</a>.</p>
    </section>
</main>
</body>
</html>
