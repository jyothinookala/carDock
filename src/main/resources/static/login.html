<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | CarDock</title><link rel="stylesheet" href="/css/styles.css">
    <script defer src="/js/app.js"></script>
</head>
<body>
<header class="site-header"><a class="brand" href="/">CarDock<span>.</span></a><nav><a href="/">Browse cars</a><a href="/register.html">Create account</a></nav></header>
<main class="page-shell narrow">
    <section class="form-card auth-card"><p class="eyebrow">Welcome back</p><h1>Log in</h1>
        <form id="login-form">
            <label>Email<input id="email" name="email" type="email" maxlength="150" autocomplete="email" required></label>
            <label>Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
            <button class="button" type="submit">Log in</button>
        </form><p id="form-message" class="message" aria-live="polite"></p>
        <p class="muted">New to CarDock? <a href="/register.html">Create an account</a>.</p>
    </section>
</main>
</body>
</html>
